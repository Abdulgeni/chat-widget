<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Widget Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 20px; }
        .feature-list { background: #f9fafb; border-radius: 8px; padding: 20px; margin: 20px 0; }
        .feature-list li { margin: 10px 0; color: #4b5563; }
        .test-button {
            background: #2563eb; color: white; border: none;
            padding: 12px 24px; border-radius: 8px; cursor: pointer;
            font-size: 16px; margin: 10px; transition: all 0.3s;
        }
        .test-button:hover {
            background: #1d4ed8; transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AI Chat Widget Test Page</h1>
        <p>Loop 1: floating button + Shadow DOM isolation.</p>

        <h3>Test Programmatic Control:</h3>
        <button class="test-button" onclick="openWidget()">Open Widget</button>
        <button class="test-button" onclick="sendTestMessage()">Send Test Message</button>
    </div>

    <script>
    (function(w,d,s,o,f,js,fjs){
        w['ChatWidgetObject']=o;w[o]=w[o]||function(){(w[o].q=w[o].q||[]).push(arguments)};
        js=d.createElement(s),fjs=d.getElementsByTagName(s)[0];js.id=o;js.src=f;js.async=1;fjs.parentNode.insertBefore(js,fjs);
    }(window,document,'script','aiChat','https://chat-widget-abdulgeni.vercel.app/widget.js'));
    aiChat('init', { appId: 'test-app', theme: { primaryColor: '#2563eb' } });
    </script>

    <script>
        function openWidget() { aiChat('open'); }
        function sendTestMessage() { aiChat('sendMessage', 'What are your business hours?'); }
    </script>
</body>
</html>
